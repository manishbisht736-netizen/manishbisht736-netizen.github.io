name: Update Rise race calendar
# Runs on the 1st of every month (and on demand). Asks Gemini (free tier, Google Search grounding)
# for upcoming races in the Gulf and India, validates the answer and commits events.json if it changed.
# Needs repository secret GEMINI_API_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ask Gemini for race dates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/update_events.py
      - name: Publish if changed
        run: |
          if git diff --quiet events.json; then echo "No change"; exit 0; fi
          git config user.name "rise-calendar-bot"
          git config user.email "support@buddhabytes.app"
          git add events.json
          git commit -m "Race calendar: monthly update $(date +%Y-%m-%d)"
          git push
