  --b1:#E07A66;--b2:#E5B94E;--b3:#8CCB5E;--b4:#4FB8A6;--b5:#5E9EE6;--b6:#9A86F0;--b7:#D97BB5;--b8:#A8987F;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--shadow2:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}
:root[data-k="midnight"]{
  --bg:#0E0D16;--sf:#191726;--sf2:#232034;--sf3:#2E2A44;--tx:#F4F1FA;--tx2:#A9A3BF;--pr:#8B85FF;--pr2:#B3A9FF;--onpr:#0E0D16;--prt:#A9A3FF;--ac:#FF8A73;--ok:#46D39A;--wn:#F2B75B;--wnbg:rgba(242,183,91,.15);--inf:#5DB3F2;--line:rgba(244,241,250,.10);--btx:#0E0D16;
  --b1:#E07A66;--b2:#E5B94E;--b3:#8CCB5E;--b4:#4FB8A6;--b5:#5E9EE6;--b6:#9A86F0;--b7:#D97BB5;--b8:#A8987F;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--shadow2:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}
:root[data-k="teal"]{color-scheme:light}
:root[data-k="citrus"]{--prt:#B45300;--bg:#FFFBF2;--sf:#FFFFFF;--sf2:#FBF1DC;--sf3:#F4E5C4;--tx:#1B1A17;--tx2:#5E5A4E;--pr:#E86A00;--pr2:#FF9A3D;--onpr:#FFFFFF;--ac:#00A38C;--line:rgba(27,26,23,.10)}
:root[data-k="forest"]{--prt:#2F7D5B;--bg:#F1F5EF;--sf:#FFFFFF;--sf2:#E3EBDF;--sf3:#D3DFCD;--tx:#1C2A22;--tx2:#4E5E54;--pr:#2F7D5B;--pr2:#4FA37E;--onpr:#FFFFFF;--ac:#C9884B;--line:rgba(28,42,34,.10)}
:root[data-k="ocean"]{--prt:#3FC1FF;--bg:#08121D;--sf:#112033;--sf2:#182C43;--sf3:#223A56;--tx:#EAF3FB;--tx2:#9FB3C8;--pr:#3FC1FF;--pr2:#7FD6FF;--onpr:#06121E;--ac:#FFB547;--ok:#46D39A;--wn:#F2B75B;--wnbg:rgba(242,183,91,.15);--inf:#5DB3F2;--line:rgba(234,243,251,.10);--btx:#06121E;
  --b1:#E07A66;--b2:#E5B94E;--b3:#8CCB5E;--b4:#4FB8A6;--b5:#5E9EE6;--b6:#9A86F0;--b7:#D97BB5;--b8:#A8987F;--shadow:0 8px 24px rgba(0,0,0,.4);--shadow2:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}
:root[data-k="mono"]{--prt:#3A3A3A;--bg:#F6F6F4;--sf:#FFFFFF;--sf2:#EDEDEA;--sf3:#E2E2DE;--tx:#202020;--tx2:#555555;--pr:#3A3A3A;--pr2:#666;--onpr:#FFFFFF;--ac:#6E8FAF;--line:rgba(0,0,0,.10);
  --b1:#E4E4E0;--b2:#DADAD5;--b3:#E9E9E5;--b4:#D2D8DE;--b5:#DDE3E8;--b6:#E2E0DA;--b7:#E6E3E3;--b8:#D8D6D0}
:root[data-k="hc"]{--prt:#FFD400;--bg:#000000;--sf:#121212;--sf2:#1E1E1E;--sf3:#2A2A2A;--tx:#FFFFFF;--tx2:#E6E6E6;--pr:#FFD400;--pr2:#FFE566;--onpr:#000000;--ac:#00E5FF;--ok:#3DFF9A;--wn:#FFB020;--wnbg:rgba(255,176,32,.22);--inf:#6CC8FF;--line:rgba(255,255,255,.45);--btx:#000000;
  --b1:#FF9E8A;--b2:#FFD84D;--b3:#A6F07A;--b4:#5FF0D6;--b5:#8EC5FF;--b6:#C4B3FF;--b7:#FFA6DA;--b8:#E8D7BF;--shadow:none;--shadow2:none;--scrim:rgba(0,0,0,.75);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:15px/1.47 var(--bd);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.dys{--hd:"Atkinson Hyperlegible",Verdana,Tahoma,sans-serif;--bd:"Atkinson Hyperlegible",Verdana,Tahoma,sans-serif}
.dys body{letter-spacing:.02em;word-spacing:.08em;line-height:1.62}
.dys em,.dys i{font-style:normal}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--prt)}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--hd);margin:0;text-wrap:balance;letter-spacing:-.01em}
.dl{font:800 40px/48px var(--hd);font-variant-numeric:tabular-nums}
h1{font-size:26px;line-height:32px;font-weight:800}
h2{font-size:20px;line-height:28px;font-weight:750}
h3{font-size:16.5px;line-height:23px;font-weight:700}
.lbl{font-size:11.5px;line-height:16px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2)}
.mut{color:var(--tx2)}.sm{font-size:13px}.xs{font-size:12px}
.tab{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(108px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.card{background:var(--sf);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.flat{box-shadow:none}
.sect{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.sect>.hd{display:flex;align-items:baseline;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;font-size:15px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr);transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px color-mix(in srgb,var(--pr) 30%,transparent);text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--sf2);color:var(--tx);box-shadow:none}
.btn.ghost{background:transparent;color:var(--prt);padding:0 12px;box-shadow:none}
.btn.big{min-height:58px;font-size:16.5px;padding:0 26px;border-radius:20px}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:12px;background:var(--sf2);font-size:13.5px;font-weight:650;color:var(--tx);border:1.5px solid transparent;text-decoration:none}
.chip.on{background:color-mix(in srgb,var(--pr) 14%,var(--sf));color:var(--prt);border-color:color-mix(in srgb,var(--pr) 35%,transparent)}
.chip.out{background:transparent;border-color:var(--line)}
.chip svg{width:16px;height:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:14px;color:var(--tx2);flex:none;position:relative}
.ib svg{width:22px;height:22px}
.ib:active{background:var(--sf2)}
input.f,textarea.f,select.f{width:100%;background:var(--sf2);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--prt);background:var(--sf)}
textarea.f{resize:vertical;min-height:120px;line-height:1.5}
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.10)}
.seg button svg{width:18px;height:18px}
/* top bar */
.topbar{display:flex;align-items:center;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 6px;position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding-left:10px;padding-right:10px}
.topbar h1{font-size:22px;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-t{padding-left:4px}
.bdot{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
/* header (Today) */
.hdr{margin:0 -16px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 18px 16px;color:#16142A;display:flex;flex-direction:column;gap:12px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hdr::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}
.hdr.plain{background:var(--sf);color:var(--tx);border-bottom:1px solid var(--line)}
.hdr .top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.hdr .hb{color:inherit}
.hdr .hb:active{background:rgba(255,255,255,.3)}
.hdr .date{font-size:13px;font-weight:700;opacity:.75;letter-spacing:.02em}
.hdr .greet{font:800 26px/32px var(--hd);letter-spacing:-.015em}
.hdr .hchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.55);font-weight:700;font-size:12.5px;color:inherit;backdrop-filter:blur(6px)}
.hdr.night .hchip{background:rgba(255,255,255,.14)}
.hdr.plain .hchip{background:var(--sf2)}
.hdr .rowx{position:relative;z-index:1}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hstats div{background:rgba(255,255,255,.5);border-radius:16px;padding:10px 12px;backdrop-filter:blur(6px)}
.hdr.night .hstats div{background:rgba(255,255,255,.1)}
.hdr.plain .hstats div{background:var(--sf2)}
.hstats b{display:block;font:800 20px/24px var(--hd);font-variant-numeric:tabular-nums}
.hstats span{font-size:11.5px;font-weight:650;opacity:.8}
.g-dawn{background:linear-gradient(135deg,#FFD8B5,#FFB4A2 55%,#F5A3D0)}
.g-morning{background:linear-gradient(135deg,#FFE8A3,#FFD37A 30%,#8EC5FF)}
.g-afternoon{background:linear-gradient(135deg,#8EC5FF,#7FD8C8 70%,#B8E986)}
.g-golden{background:linear-gradient(135deg,#FFB86B,#FF8A73 55%,#FF6B57)}
.g-night{background:linear-gradient(160deg,#3A2F7A,#1C1840 55%,#0E0D16);color:#F4F1FA}
.mring{position:relative;flex:none;z-index:1}
.mring text{font:800 13px var(--hd);fill:currentColor}
/* list banner */
.banner{margin-top:6px;border-radius:26px;padding:18px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--lc) 34%,var(--sf)),color-mix(in srgb,var(--lc) 12%,var(--sf)));border:1px solid color-mix(in srgb,var(--lc) 30%,transparent);position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:-30px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--lc) 22%,transparent)}
.banner .bi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:var(--lc);color:#fff;flex:none;box-shadow:0 8px 18px color-mix(in srgb,var(--lc) 40%,transparent);position:relative;z-index:1}
.banner .bi svg{width:26px;height:26px}
.banner>div{position:relative;z-index:1}
.avs{display:flex}
.avs .av{margin-left:-8px;border:2px solid var(--sf)}
.avs .av:first-child{margin-left:0}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;flex:none;letter-spacing:0;line-height:1}
.qadd{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border-radius:18px;background:var(--sf);border:1.5px dashed color-mix(in srgb,var(--pr) 30%,var(--line));color:var(--tx2);font-weight:650;margin-top:12px}
.qadd svg{width:20px;height:20px;color:var(--prt)}
/* reality bar */
.rbar{display:flex;flex-direction:column;gap:8px}
.rtrack{height:10px;border-radius:99px;background:var(--sf2);overflow:hidden;position:relative}
.rfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#34D399,var(--ok));transition:width .3s}
.rfill.over{background:linear-gradient(90deg,#FFD37A,var(--wn))}
/* task cards */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:flex-start;gap:6px;padding:8px 6px 8px 8px;min-height:62px;position:relative;background:var(--sf);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:pan-y;transition:opacity .3s,transform .2s,background .2s;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--lc,transparent)}
.row .chk{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--pc,var(--tx2));flex:none;display:grid;place-items:center;color:#fff;margin:10px 6px 0 8px;background:color-mix(in srgb,var(--pc) 8%,transparent)}
.row .chk svg{width:15px;height:15px}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done{opacity:.72;box-shadow:none}
.row.done .rt{text-decoration:line-through;color:var(--tx2)}
.row .rmain{flex:1;min-width:0;text-align:left;padding:8px 0}
.rt{font-size:15.5px;line-height:21px;font-weight:650;overflow-wrap:anywhere}
.rm{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--tx2);margin-top:5px;font-weight:650}
.rm>span{display:inline-flex;align-items:center;gap:4px;background:var(--sf2);padding:2px 8px;border-radius:8px;min-height:22px}
.rm svg{width:12px;height:12px}
.rm .today{background:color-mix(in srgb,var(--pr) 12%,var(--sf));color:var(--prt)}
.rm .late{background:var(--wnbg);color:var(--tx)}
.rm .stp{background:color-mix(in srgb,var(--sc) 16%,var(--sf));color:var(--tx)}
.rm .stp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.rside{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.rside .av{margin-top:6px}
.hurdle{margin-top:6px;font-size:12.5px;font-weight:600;background:var(--wnbg);border-radius:10px;padding:6px 9px;overflow-wrap:anywhere}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.p1{--pc:#FF5A5F}.p2{--pc:var(--wn)}.p3{--pc:var(--inf)}.p4{--pc:var(--tx2)}
.pt{color:var(--pc)!important}
.row.swr{background:color-mix(in srgb,var(--ok) 18%,var(--sf))}
.row.swl{background:color-mix(in srgb,var(--pr) 14%,var(--sf))}
.amb{color:var(--tx);background:var(--wnbg);border-radius:8px;padding:0 6px}
.grp{display:flex;align-items:center;gap:8px;margin:20px 2px 2px}
.grp h3{font-size:15px}
.grp .gc{font-size:12px;font-weight:750;color:var(--tx2);background:var(--sf2);border-radius:8px;padding:1px 8px}
/* timeline */
.tl{position:relative;margin-left:52px;border-left:1.5px dashed var(--line)}
.tl .hr{position:absolute;left:-52px;width:44px;text-align:right;font-size:11.5px;font-weight:700;color:var(--tx2);transform:translateY(-8px)}
.tl .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.7}
.blk{position:absolute;left:8px;right:0;border-radius:16px;padding:8px 8px 8px 12px;color:var(--btx);display:flex;gap:8px;align-items:flex-start;overflow:hidden;background:var(--bc);box-shadow:0 4px 12px rgba(0,0,0,.08);transition:opacity .3s}
[data-k="mono"] .blk{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 6px,transparent 6px 12px)}
.blk .bt{font-weight:750;font-size:14.5px;line-height:19px;overflow-wrap:anywhere}
.blk .bs{font-size:12px;font-weight:650;opacity:.8}
.blk .bm{flex:1;min-width:0;text-align:left}
.blk .ib{width:36px;height:36px;color:var(--btx);background:rgba(255,255,255,.4);border-radius:12px}
.blk .av{border:2px solid rgba(255,255,255,.7)}
.blk.bdone{opacity:.55;filter:saturate(.8)}
.blk.bdone .bt{text-decoration:line-through}
.blk.bnow{box-shadow:0 0 0 3px var(--pr),0 8px 22px rgba(0,0,0,.18)}
.blk.bpast{opacity:.72}
.blk.bslip{background:transparent;border:2px dashed var(--bc);color:var(--tx)}
.blk.bslip .ib{color:var(--tx);background:var(--sf2)}
.blk.cmp{padding:3px 6px 3px 10px;align-items:center}.blk.cmp .ib{width:26px;height:26px;border-radius:8px;font-size:13px}.blk.cmp .ib svg{width:16px;height:16px}.blk.cmp .bt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk.cmp .chip{min-height:24px!important;font-size:12px}
.blk .prog{position:absolute;left:0;bottom:0;height:4px;background:rgba(0,0,0,.25)}
.gap{position:absolute;left:8px;right:0;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--tx2);font-weight:650}
.gap svg{width:14px;height:14px}
.nowl{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--ac);z-index:3}
.nowl::before{content:"";position:absolute;left:-5px;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ac)}
.nowl span{position:absolute;left:-58px;width:48px;text-align:right;top:-9px;font-size:11.5px;font-weight:800;color:var(--ac);background:var(--bg);padding:0 4px;border-radius:6px}
.lockin .blk{animation:lock .38s cubic-bezier(.2,1.4,.4,1) both}
@keyframes lock{from{transform:translateY(-14px) scale(.96);opacity:0}}
/* nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--tx2);min-height:52px;justify-content:center;position:relative}
nav.bar button svg{width:24px;height:24px}
nav.bar button.on{color:var(--prt)}
nav.bar button.on::after{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:3px;background:var(--pr)}
nav.bar .fab{width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr);margin:-28px auto 0;box-shadow:0 10px 24px color-mix(in srgb,var(--pr) 45%,transparent)}
nav.bar .fab::after{display:none}
nav.bar .fab svg{width:28px;height:28px}
.cnt{position:absolute;top:3px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:99px;background:var(--sf2);color:var(--tx);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:1px solid var(--line)}
.mini{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:29;max-width:616px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:var(--shadow2)}
.mini .pulse{width:10px;height:10px;border-radius:50%;background:var(--ac);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
/* drawer */
.drw-w{position:fixed;inset:0;z-index:55;background:var(--scrim);animation:fade .2s}
.drw{position:absolute;left:0;top:0;bottom:0;width:min(86vw,330px);background:var(--sf);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 10px calc(20px + env(safe-area-inset-bottom,0px));animation:slidein .25s cubic-bezier(.2,.9,.3,1);border-radius:0 26px 26px 0;box-shadow:var(--shadow2)}
@keyframes slidein{from{transform:translateX(-40px);opacity:0}}
.drw-me{display:flex;align-items:center;gap:12px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dit{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 10px;border-radius:14px;font-weight:650;text-align:left}
.dit.on{background:color-mix(in srgb,var(--pr) 11%,var(--sf))}
.dit .dic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;font-size:15px}
.dit .dic svg{width:17px;height:17px}
.dct{font-size:12px;font-weight:750;color:var(--tx2)}
.dsec{display:flex;align-items:center;padding:16px 10px 4px}
/* sheets & overlays */
.sw{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--sf3);margin:0 auto 12px}
.sheet .sh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;animation:fade .2s}
.ov .oin{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;gap:16px}
.ov.ov-intro .oin{max-width:none;padding:0;gap:0}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--sf3);transition:width .2s}
.dots i.on{background:var(--pr);width:22px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--sf2);text-align:left;width:100%;min-height:56px;border:2px solid transparent}
.opt.on{border-color:var(--prt);background:color-mix(in srgb,var(--pr) 10%,var(--sf))}
.opt .oi{font-size:22px;width:30px;text-align:center}
.opt b{display:block;font-weight:700}
.toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:80;max-width:616px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .2s}
.toast button{color:var(--bg);font-weight:800;padding:6px 10px;border-radius:10px;background:rgba(127,127,127,.28)}
/* task detail */
.stagebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stg{min-height:40px;border-radius:12px;background:var(--sf2);font-size:12.5px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--tx2);border:1.5px solid transparent}
.stg i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.stg.on{background:color-mix(in srgb,var(--sc) 16%,var(--sf));color:var(--tx);border-color:color-mix(in srgb,var(--sc) 45%,transparent)}
textarea.ttl{font:750 20px/28px var(--hd);min-height:0;background:transparent;padding:6px 2px}
textarea.ttl:focus{background:var(--sf2)}
.asg{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--pr) 7%,var(--sf2));width:100%;text-align:left}
.asg.empty{border:1.5px dashed color-mix(in srgb,var(--pr) 35%,var(--line));background:transparent;color:var(--prt);font-weight:700;min-height:52px}
.asg.empty svg{width:22px;height:22px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--sf2);text-align:left;min-height:58px}
.drow .dri{width:32px;height:32px;border-radius:10px;background:var(--sf);display:grid;place-items:center;color:var(--prt);flex:none;font-weight:800}
.drow .dri svg{width:18px;height:18px}
.drow small{display:block;font-size:11px;font-weight:750;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.drow b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow.set b{color:var(--prt)}
.hcard{background:var(--wnbg);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm .bub{background:var(--sf2);border-radius:4px 16px 16px 16px;padding:8px 12px;flex:1;min-width:0}
.cm.mine{flex-direction:row-reverse}
.cm.mine .bub{background:color-mix(in srgb,var(--pr) 13%,var(--sf));border-radius:16px 4px 16px 16px}
.cm .bub p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.act{display:flex;gap:10px;font-size:13px;align-items:flex-start;padding:4px 0}
.act i{width:8px;height:8px;border-radius:50%;background:var(--pr);margin-top:6px;flex:none}
.dfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* calendar */
.calg{margin-top:10px;background:var(--sf);border-radius:24px;padding:10px 8px;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:pan-y}
.cwd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:800;color:var(--tx2);letter-spacing:.05em;padding:2px 0 6px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cday{min-height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:stretch;padding:4px 2px;gap:2px;overflow:hidden}
.cday .cn{font-size:13px;font-weight:750;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
.cday.out{opacity:.38}
.cday.tod .cn{background:var(--ac);color:#fff}
.cday.sel{background:color-mix(in srgb,var(--pr) 12%,var(--sf))}
.cday.sel .cn{outline:2px solid var(--pr)}
.cbars{display:flex;flex-direction:column;gap:2px}
.cbars i{display:block;height:6px;border-radius:4px;background:var(--bc);overflow:hidden}
.cbars i em{display:none}
.cbars i.dn{opacity:.4}
.cbars b{font-size:9.5px;color:var(--tx2);text-align:center;line-height:10px}
@media (min-width:520px){.cday{min-height:86px}.cbars i{height:16px;font-size:10.5px;font-weight:700;color:var(--btx);padding:0 4px;line-height:16px}.cbars i em{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wstrip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;background:var(--sf);border:1px solid var(--line);font-weight:700;font-size:11.5px;color:var(--tx2)}
.wstrip button b{font-size:17px;color:var(--tx)}
.wstrip button.on{background:linear-gradient(160deg,var(--pr),var(--pr2));color:var(--onpr);border-color:transparent}
.wstrip button.on b{color:var(--onpr)}
.wstrip button.tod:not(.on) b{color:var(--ac)}
/* board */
.board{display:flex;gap:10px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 10px;scroll-snap-type:x mandatory}
.bcol{flex:0 0 min(78vw,280px);background:var(--sf2);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;align-self:flex-start}
.bch{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.bch i{width:10px;height:10px;border-radius:50%}
.bcard{background:var(--sf);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line)}
.bcard .bt2{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.bcadd{min-height:40px;border-radius:14px;color:var(--tx2);font-weight:700;border:1.5px dashed var(--line)}
/* focus */
.fwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:10px}
.fring{position:relative;width:min(78vw,300px);aspect-ratio:1;max-width:100%}
.fring svg{width:100%;height:100%}
.fring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:30px}
.fdig{font:800 52px/1 var(--hd);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mix{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.snd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--sf2);font-size:12.5px;font-weight:700;border:2px solid transparent}
.snd.on{border-color:var(--prt);background:color-mix(in srgb,var(--pr) 12%,var(--sf))}
.snd .e{font-size:22px}
input[type=range]{width:100%;accent-color:var(--prt)}
/* misc */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bento .wide{grid-column:1/-1}
.tile{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:var(--shadow)}
.tile .big{font:800 28px/1.1 var(--hd);font-variant-numeric:tabular-nums}
.linkrow{display:flex;align-items:center;gap:12px;padding:14px;min-height:58px;width:100%;text-align:left;font-weight:650}
.linkrow+.linkrow{border-top:1px solid var(--line)}
.linkrow .li{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--sf2);color:var(--prt)}
.linkrow .li svg{width:20px;height:20px}
.linkrow>svg{width:18px;height:18px;color:var(--tx2);flex:none}
.lcard{background:var(--sf);border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;background:var(--sf);border:1px solid var(--line);font-weight:650;font-size:12px;color:var(--tx2)}
.strip button b{font-size:17px;color:var(--tx)}
.strip button.on{background:var(--pr);color:var(--onpr);border-color:var(--prt)}
.strip button.on b{color:var(--onpr)}
.load{border-radius:50%;background:currentColor;opacity:.7}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx .q{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.mx .q button.t{text-align:left;font-size:14px;padding:8px 10px;background:var(--sf2);border-radius:12px;font-weight:600;overflow-wrap:anywhere}
.heat{display:grid;grid-template-columns:34px repeat(6,1fr);gap:3px;font-size:10.5px;color:var(--tx2);font-weight:650}
.heat i{aspect-ratio:1.6;border-radius:5px;background:var(--pr)}
.ccard{background:var(--sf);border-radius:28px;padding:22px;box-shadow:var(--shadow2);border:1px solid var(--line);min-height:220px;display:flex;flex-direction:column;gap:14px;touch-action:none;user-select:none;transition:transform .2s}
.burst{position:fixed;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:90;animation:burst .55s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:.9}to{transform:translate(-50%,-50%) scale(7);opacity:0}}
.petal{position:fixed;top:-20px;width:12px;height:16px;border-radius:12px 0 12px 0;z-index:90;pointer-events:none;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.lantern{font-size:64px;text-align:center;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #FFB86B)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 10px}
.empty svg.fox{width:110px;height:100px}
.bar2{height:8px;border-radius:9px;background:var(--sf2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--pr);border-radius:9px}
details>summary{cursor:pointer;list-style:none;font-weight:700;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
hr.s{border:0;border-top:1px solid var(--line);margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:750;padding:2px 9px;border-radius:99px;background:var(--sf2)}
.note{display:flex;gap:12px;padding:12px;border-radius:16px;align-items:flex-start;text-align:left;width:100%}
.note.unread{background:color-mix(in srgb,var(--pr) 8%,var(--sf))}
/* intro */
.intro{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));color:#16142A;position:relative;overflow:hidden;touch-action:pan-y}
.intro.dk{color:#F4F1FA}
.intro .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;background:#fff;pointer-events:none}
.introtop{display:flex;align-items:center;position:relative;z-index:1;min-height:44px}
.introskip{font-weight:750;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.3);color:inherit}
.art{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;min-height:300px;padding:10px 0}
.introtx{position:relative;z-index:1;max-width:520px;margin:0 auto;width:100%}
.introtx h1{font-size:34px;line-height:40px;letter-spacing:-.025em}
.introtx p{font-size:16.5px;line-height:1.55;margin:12px 0 0;opacity:.82;max-width:44ch}
.introbot{display:flex;align-items:center;gap:14px;margin:26px auto 0;max-width:520px;width:100%;position:relative;z-index:1}
.introbot .dots i{background:rgba(22,20,42,.2)}
.intro.dk .introbot .dots i{background:rgba(255,255,255,.3)}
.introbot .dots i.on{background:currentColor}
.introbot .btn{margin-left:auto;background:#16142A;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.intro.dk .introbot .btn{background:#fff;color:#16142A}
.introbot .btn.ghost{background:transparent;color:inherit;box-shadow:none;margin-left:0}
.glass{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border-radius:22px;box-shadow:0 18px 40px rgba(30,20,90,.18);color:#16142A;border:1px solid rgba(255,255,255,.7)}
.intro.dk .glass{background:rgba(255,255,255,.1);color:#F4F1FA;border-color:rgba(255,255,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.fl{animation:floatin .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes floatin{from{transform:translateY(24px) scale(.96);opacity:0}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.typing{overflow:hidden;white-space:nowrap;border-right:2px solid currentColor;animation:type 2.2s steps(28) .3s both,caret .8s step-end infinite}
@keyframes type{from{width:0}}
@keyframes caret{50%{border-color:transparent}}
.ringdraw circle.fg{animation:draw 1.8s cubic-bezier(.3,.8,.3,1) both}
@keyframes draw{from{stroke-dashoffset:var(--c)}}
.rm-anim *,.rm-anim *::before,.rm-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* visuals */
.i3{display:block;object-fit:contain;flex:none;filter:drop-shadow(0 6px 10px rgba(16,32,29,.16))}
.illus{display:block;width:min(260px,72%);height:auto;margin:0 auto 4px;max-height:210px;object-fit:contain}
.illus.sm{width:min(180px,55%);max-height:140px}
.illus.md{width:min(300px,80%);max-height:240px}
.lot{width:170px;height:170px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.lot.lot-lg{width:min(260px,70vw);height:min(260px,70vw)}
.lot.lot-sm{width:110px;height:110px}
.lot.lot-xs{width:52px;height:52px;margin:0}
.tile .lot.t3{position:absolute;right:8px;top:6px}
.lot.lot-wide{width:min(300px,80vw);height:110px}
.confetti{position:fixed;inset:0;z-index:95;pointer-events:none}
.hdr.ph{background:linear-gradient(180deg,rgba(4,22,20,.22),rgba(4,22,20,.66)),var(--ph) center/cover;color:#fff}
.hdr.ph::after{display:none}
.hdr.ph .hchip,.hdr.ph .hstats div{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.hdr.ph .hb:active{background:rgba(255,255,255,.18)}
.hdr.ph .mring{color:#fff}
.hstats div{display:flex;flex-direction:column;gap:2px;position:relative}
.hstats .hs{width:22px;height:22px;margin-bottom:4px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.dit .dic .i3{width:24px;height:24px;filter:none}
.banner .bi.b3{background:color-mix(in srgb,var(--sf) 70%,transparent);box-shadow:none}
.banner .bi.b3 .i3{width:46px;height:46px}
.linkrow .li.l3{background:color-mix(in srgb,var(--pr) 10%,var(--sf))}
.linkrow .li.l3 .i3{width:28px;height:28px;filter:none}
.tile .t3{position:absolute;right:12px;top:12px}
.tile{position:relative}
.tipc{display:flex;gap:12px;align-items:center}
.fbg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(3,18,16,.52),rgba(3,18,16,.8)),var(--ph) center/cover}
.fdark{color:#fff;position:relative;z-index:1}
.fdark .card{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:none;backdrop-filter:blur(8px)}
.fdark .btn.sec,.fdark .chip{background:rgba(255,255,255,.15);color:#fff}
.fdark .btn.ghost{color:#fff;opacity:.85}
.fdark .mut,.fdark .lbl,.fdark .xs{color:rgba(255,255,255,.78)}
.fdark input.f{background:rgba(255,255,255,.14);color:#fff}
.fdark input.f::placeholder{color:rgba(255,255,255,.6)}
.fdark .snd{background:rgba(255,255,255,.12);color:#fff}
.fdark .pill{background:rgba(255,255,255,.16);color:#fff}
.fdark h1{color:#fff}
.art .fl3{position:absolute;width:78px;height:78px;animation:bob 4.5s ease-in-out infinite;z-index:2}
.art .fl3.da{left:max(2%,calc(50% - 200px));top:4%}
.art .fl3.db{right:max(2%,calc(50% - 200px));bottom:2%;animation-delay:-2s}
.empty h3{margin-top:4px}
.fhero{display:flex;align-items:center;gap:12px;overflow:hidden}
.fhero .illus{width:120px;margin:0;max-height:110px}

/* photo intro + reveal transition */
.ov.ov-intro .oin{position:relative}
.intro.iph{color:#fff;background:#0b1413}
.intro .ibg{position:absolute;inset:-4%;background:center/cover no-repeat;animation:kb 14s ease-out both;z-index:0}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.intro .iscrim{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,.08) 46%,rgba(3,22,20,.78) 72%,rgba(3,22,20,.94) 100%)}
.intro.iph .introtop,.intro.iph .introtx,.intro.iph .introbot{z-index:1}
.intro.iph .introskip{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px)}
.itag{display:inline-block;font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;background:#00CAB9;color:#03261F;padding:6px 11px;border-radius:999px;margin-bottom:14px}
.intro.iph .introtx h1{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.intro.iph .introtx p{opacity:.92}
.intro.iph .introtx>*{animation:fadeup .7s cubic-bezier(.2,.9,.3,1) both}
.intro.iph .introtx h1{animation-delay:.12s}.intro.iph .introtx p{animation-delay:.22s}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}}
.ichips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.intro.iph .ichip{padding:8px 12px;font-weight:750;font-size:13px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(10px);box-shadow:none;animation:floatin .6s cubic-bezier(.2,.9,.3,1) both}
.intro.iph .introbot .dots i{background:rgba(255,255,255,.35)}
.intro.iph .introbot .dots i.on{background:#fff}
.intro.iph .introbot .btn{background:#fff;color:#10201D}
.intro-old{position:absolute!important;inset:0;z-index:0;pointer-events:none}
.intro.rev{position:relative;z-index:1;animation:reveal .85s cubic-bezier(.65,0,.2,1) both}

/* ---------------- recurrence ---------------- */
function nextFrom(rc,base){const t=today();let k=base;
 if(rc.type==='after')return addDays(t,rc.n||1);

 if(rc.type==='weekdays'){do{k=addDays(k,1)}while([0,6].includes(parseD(k).getDay()));return k}
 if(rc.type==='weekly'){for(let i=1;i<=7;i++){const c=addDays(k,i);if((rc.days||[]).includes(parseD(c).getDay()))return c}return addDays(k,7)}
 if(rc.type==='monthly'){const d=parseD(k);return dkey(new Date(d.getFullYear(),d.getMonth()+1,Math.min(d.getDate(),28)))}
 if(rc.type==='every'){if(rc.unit==='month'){const d=parseD(k);return dkey(new Date(d.getFullYear(),d.getMonth()+rc.n,Math.min(d.getDate(),28)))}return addDays(k,rc.n*(rc.unit==='week'?7:1))}
 return addDays(k,1)}
function firstOcc(rc){const t=today();if(rc.type==='weekly'&&!(rc.days||[]).includes(parseD(t).getDay()))return nextFrom(rc,t);if(rc.type==='weekdays'&&[0,6].includes(parseD(t).getDay()))return nextFrom(rc,t);return t}

 if(rc.type==='weekly')return'Every '+(rc.days||[]).map(d=>DAYN[d]).join(', ');if(rc.type==='after')return rc.n+' days after done';if(rc.type==='every')return'Every '+rc.n+' '+rc.unit+'s';return'Repeats'}
function spawnNext(t){let base=t.doDate&&t.doDate>today()?t.doDate:(t.doDate||today());if(t.recur.type!=='after'&&base<today())base=today();
 const nd=nextFrom(t.recur,base);const shift=t.doDate?dayDiff(t.doDate,nd):0;
 return newTask({title:t.title,notes:t.notes,project:t.project,tags:[...t.tags],prio:t.prio,energy:t.energy,est:t.est,doDate:nd,dueDate:t.dueDate?addDays(t.dueDate,shift):null,start:t.start,status:'open',recur:t.recur,
  subtasks:t.subtasks.map(s=>({...s,id:uid(),done:false})),ifThen:t.ifThen,size:t.size,frog:false,src:'recur',prev:t.id})}

const AU={ctx:null,bufs:{},layers:{}};
function actx(){try{if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ctx=new C()}if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx}catch(e){return null}}
function chime(kind){if(!K.set.sound||K.set.comfort.lowstim)return;const c=actx();if(!c)return;const t=c.currentTime;
 const notes={tick:[[1320,.05,.08]],start:[[660,.18,1.2],[990,.08,1.2]],end:[[523,.2,2.4],[784,.14,2.4],[1046,.08,2.4]],break:[[880,.12,.9],[880,.12,.9,.35]],day:[[392,.12,1.8],[523,.1,1.8,.15],[659,.08,1.8,.3]]}[kind]||[[880,.1,.6]];
 notes.forEach(([f,v,d,dl=0])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+dl);g.gain.linearRampToValueAtTime(v,t+dl+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dl+d);o.connect(g).connect(c.destination);o.start(t+dl);o.stop(t+dl+d+.05)})}
function noise(kind){const c=actx();if(AU.bufs[kind])return AU.bufs[kind];const n=c.sampleRate*4,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
 let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;
  if(kind==='white')d[i]=w*.5;else if(kind==='pink'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
  else{last=(last+.02*w)/1.02;d[i]=last*3.5}}AU.bufs[kind]=b;return b}
function loopSrc(kind){const c=actx(),s=c.createBufferSource();s.buffer=noise(kind);s.loop=true;s.start();return s}
function lfo(c,freq,depth,target){const o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=depth;o.connect(g).connect(target);o.start();return o}
const SOUNDS={
 rain:{n:'Rain',e:'🌧️',mk(c,out){const s=loopSrc('pink'),hp=c.createBiquadFilter(),lp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=400;lp.type='lowpass';lp.frequency.value=6000;s.connect(hp).connect(lp).connect(out);return[s]}},
 ocean:{n:'Ocean',e:'🌊',mk(c,out){const s=loopSrc('brown'),g=c.createGain();g.gain.value=.55;const o=lfo(c,.09,.45,g.gain);s.connect(g).connect(out);return[s,o]}},
 wind:{n:'Wind',e:'🍃',mk(c,out){const s=loopSrc('pink'),bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=.9;const o=lfo(c,.06,260,bp.frequency);s.connect(bp).connect(out);return[s,o]}},
 fire:{n:'Fireplace',e:'🔥',mk(c,out){const s=loopSrc('brown'),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;s.connect(lp).connect(out);
  const iv=setInterval(()=>{if(Math.random()<.55){const b=c.createBufferSource(),g=c.createGain(),hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;b.buffer=noise('white');const t=c.currentTime;g.gain.setValueAtTime(.5*Math.random(),t);g.gain.exponentialRampToValueAtTime(.001,t+.03+Math.random()*.05);b.connect(hp).connect(g).connect(out);b.start(t,Math.random()*3,.1)}},140);
  return[s,{stop(){clearInterval(iv)}}]}},
 brown:{n:'Brown noise',e:'🟤',mk(c,out){const s=loopSrc('brown');s.connect(out);return[s]}},
 pink:{n:'Pink noise',e:'🌸',mk(c,out){const s=loopSrc('pink');s.connect(out);return[s]}},
 white:{n:'White noise',e:'⚪',mk(c,out){const s=loopSrc('white'),g=c.createGain();g.gain.value=.5;s.connect(g).connect(out);return[s]}},
 hum:{n:'Deep hum',e:'🎐',mk(c,out){return[55,110.4,165.2].map((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=[.25,.12,.05][i];o.connect(g).connect(out);o.start();return o})}},
};

function list135(all){const open=all.filter(t=>t.status==='open'),done=all.filter(t=>t.status==='done');const g={big:[],med:[],small:[],none:[]};open.forEach(t=>g[sizeOf(t)||'none'].push(t));
 const cap=dayR(today()).light?{big:1,med:1,small:1}:CAP135;
 let h=[['big','1 big thing'],['med','3 medium'],['small','5 small'],['none','Not sized']].map(([k,l])=>g[k].length||k!=='none'?`<div class="stack" style="gap:6px"><div class="rowx"><span class="lbl sp">${l}</span>${cap[k]?`<span class="xs tab ${g[k].length>cap[k]?'amb':'mut'}">${g[k].length}/${cap[k]}</span>`:''}</div>${g[k].length?list(g[k],{date:false}):`<div class="xs mut" style="padding:0 4px 4px">Empty slot</div>`}</div>`:'').join('');
 if(done.length)h+=`<details ${V.showDone?'open':''}><summary class="mut">Done today · ${done.length}</summary>${list(done,{date:false})}</details>`;return`<div class="stack">${h}</div>`}

/* ---------------- timeline ---------------- */
const PPM=1.6,MINH=44;
function timeline(k,noAnim){const S0=toMin(K.set.dayStart),E0=toMin(K.set.dayEnd);const all=todayList(k);const bl=all.filter(t=>t.start).sort((a,b)=>toMin(a.start)-toMin(b.start));
 let rs=S0,re=E0;bl.forEach(t=>{rs=Math.min(rs,toMin(t.start));re=Math.max(re,toMin(t.start)+estOf(t))});rs=Math.floor(rs/60)*60;re=Math.min(1440,Math.ceil(re/60)*60);
 const isT=k===today(),n=nowMin();const Y=m=>(m-rs)*PPM;let h='';
 for(let m=rs;m<=re;m+=60)h+=(isT&&Math.abs(m-n)<14?'':`<div class="hr" style="top:${Y(m)}px">${fmtT(fromMin(m%1440))}</div>`)+`<div class="hr-x" hidden></div><div class="hl" style="top:${Y(m)}px"></div>`;
 // columns for overlaps
 const cols=[];let cl=[],clEnd=-1;const flush=()=>{const nc=Math.max(1,...cl.map(x=>x.col+1));cl.forEach(x=>x.nc=nc);cl=[]};
 const L=bl.map(t=>{const s=toMin(t.start),e=s+estOf(t);return{t,s,e,ve:Math.max(e,s+(MINH+4)/PPM)}});
 L.forEach(x=>{if(x.s>=clEnd&&cl.length){flush();cols.length=0}let c=cols.findIndex(e=>e<=x.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=x.e;x.col=c;cl.push(x);clEnd=Math.max(clEnd,x.e)});if(cl.length)flush();
 L.forEach(x=>{const t=x.t,done=t.status==='done',now=isT&&x.s<=n&&x.e>n&&!done,past=isT&&x.e<=n,slip=past&&!done;const nxt=L.find(y=>y!==x&&y.col===x.col&&y.s>=x.e&&y.s<x.ve);const room=nxt?(nxt.s-x.s)*PPM-4:1e9;const ht=Math.max(40,Math.min(room,Math.max(MINH,(x.e-x.s)*PPM-4)));const cmp=ht<MINH;
  const st=done?'bdone':slip?'bslip':now?'bnow':past?'bpast':'';const w=100/x.nc;
  h+=`<div class="blk ${st}${cmp?' cmp':''}" style="--bc:${blockColor(t)};top:${Y(x.s)+2}px;height:${ht}px;left:calc(8px + ${w*x.col}% - ${x.col?8*x.col/x.nc:0}px);width:calc(${w}% - ${8/x.nc+4}px);right:auto">
  <button class="ib" data-a="complete" data-id="${t.id}" aria-label="${done?'Mark not done':'Complete'} ${H(t.title)}" style="background:${done?'var(--ok)':'rgba(255,255,255,.35)'};color:${done?'#fff':'inherit'}">${done?IC.check:projEmoji(t)}</button>
  <button class="bm" data-a="open" data-id="${t.id}"><div class="bt">${t.frog?'🐸 ':''}${H(t.title)}${t.assignee?' '+avatar(t.assignee,20):''}</div>${ht>60?`<div class="bs tab">${fmtT(t.start)}–${fmtT(fromMin(x.e))} · ${fmtDur(x.e-x.s)}</div>`:''}</button>
  ${slip?`<button class="chip" style="min-height:32px;padding:0 10px" data-a="slip" data-id="${t.id}">Move?</button>`:!done&&x.nc===1?`<button class="ib" data-a="focusTask" data-id="${t.id}" aria-label="Focus on ${H(t.title)}">${IC.play}</button>`:''}
  ${now?`<div class="prog" style="width:${(n-x.s)/(x.e-x.s)*100}%"></div>`:''}</div>`});
 // open gaps
 let cur=isT?Math.max(rs,ceil5(n)):rs;const busy=L.map(x=>[x.s,Math.max(x.e,x.s+(Math.max(MINH,(x.e-x.s)*PPM)+2)/PPM)]).sort((a,b)=>a[0]-b[0]);
 const gaps=[];busy.forEach(([s,e])=>{if(s-cur>=20)gaps.push([cur,s]);cur=Math.max(cur,e)});if(Math.min(re,E0)-cur>=20)gaps.push([cur,Math.min(re,E0)]);
 gaps.forEach(([s,e])=>{h+=`<button class="gap" data-a="addAt" data-t="${fromMin(s)}" data-k="${k}" style="top:${Y(s)+3}px;height:${Math.max(30,(e-s)*PPM-6)}px">${IC.plus}Open space · ${fmtDur(e-s)}</button>`});
 if(isT&&n>=rs&&n<=re){const nx=nextBlock();h+=`<div class="nowl" style="top:${Y(n)}px" aria-label="Now"><span class="tab">${fmtT(fromMin(n))}</span></div>`}
 const unplaced=all.filter(t=>!t.start&&t.status==='open');const dn=all.filter(t=>!t.start&&t.status==='done');
 return`<div class="tl ${noAnim?'':V.lockAnim?'lockin':''}" style="height:${Y(re)+10}px;margin-top:14px">${h}</div>
 ${unplaced.length?`<div class="stack" style="margin-top:14px"><div class="rowx"><span class="lbl sp">Not on the timeline yet · ${unplaced.length}</span><button class="chip on" data-a="arrange" data-k="${k}">${IC.spark} Auto-arrange</button></div>${list(unplaced)}</div>`:''}
 ${dn.length?`<details style="margin-top:10px"><summary class="mut">Done (unscheduled) · ${dn.length}</summary>${list(dn)}</details>`:''}`}

function arrange(k,ids){const S0=toMin(K.set.dayStart),E0=toMin(K.set.dayEnd);const isT=k===today();let cur=isT?Math.max(S0,ceil5(nowMin()+5)):S0;
 const busy=todayList(k).filter(t=>t.start&&!ids.includes(t.id)).map(t=>[toMin(t.start),toMin(t.start)+estOf(t)]);
 const peakEnd=K.set.peak==='morning'?12*60:K.set.peak==='afternoon'?17*60:21*60,peakStart=K.set.peak==='morning'?S0:K.set.peak==='afternoon'?13*60:17*60;
 const ts=ids.map(T).filter(Boolean).sort((a,b)=>(b.frog-a.frog)||(b.mit-a.mit)||((a.energy==='H'?0:1)-(b.energy==='H'?0:1))||(a.prio-b.prio)||((a.dueDate||'9')<(b.dueDate||'9')?-1:1));
 const plan=[],over=[];
 ts.forEach(t=>{const se=smartEst(t);const dur=se?se.min:estOf(t);let start=cur;let why=[];
  if(t.frog)why.push('🐸 frog goes first');if(t.energy==='H'&&cur<peakEnd)why.push('⚡ your peak window');
  if(t.energy==='L'&&14*60>cur&&14*60+dur<=E0){start=Math.max(cur,14*60);why.push('low-energy task after lunch')}
  if(t.dueDate)why.push('due '+fmtDate(t.dueDate));if(se)why.push(`you usually take ${se.r}×, planned ${fmtDur(dur)}`);
  let guard=0;for(;guard<200;guard++){const hit=busy.find(([s,e])=>start<e&&start+dur>s);if(!hit)break;start=ceil5(hit[1])}
  if(start+dur>E0){over.push(t);return}
  plan.push({id:t.id,start:fromMin(start),dur,why:why.join(' · ')});const buf=dur>=45?10:5;busy.push([start,start+dur+buf]);if(start===cur||start<cur+dur)cur=start+dur+buf});
 return{plan,over}}

/* ---------------- FOCUS ---------------- */
function fElapsed(){const f=K.focus;if(!f)return 0;const now=f.pausedAt||Date.now();return Math.max(0,(now-f.start-f.paused)/1000)}
function fRemain(){const f=K.focus;return f&&f.dur?f.dur*60-fElapsed():null}
function fClock(){const f=K.focus;if(!f)return'';const s=f.dur?Math.max(0,Math.ceil(fRemain())):Math.floor(fElapsed());return pad(Math.floor(s/60))+':'+pad(s%60)}
const MODES={pomo:'Pomodoro',flow:'Flowtime',custom:'Custom',block:'Until block ends'};
function startFocus(o){if(K.focus&&K.focus.phase==='work')logWork(fElapsed()/60);FDONE=null;
 let dur=o.dur;const mode=o.mode||K.set.mode;
 if(dur==null){if(mode==='pomo')dur=K.set.pomo[0];else if(mode==='custom')dur=K.set.custom[0];else if(mode==='block'){const t=T(o.taskId);const b=t&&t.start&&t.doDate===today()?toMin(t.start)+estOf(t)-nowMin():0;dur=b>=5?Math.round(b):25}else dur=null}
 K.focus={taskId:o.taskId||null,mode,phase:'work',dur,start:Date.now(),pausedAt:null,paused:0,cycle:o.cycle||1,park:[],tiny:!!o.tiny,warned:false};
 const t=T(o.taskId);if(t&&t.status==='inbox'){t.status='open';t.doDate=t.doDate||today()}
 save();chime('start');vib(15);sndStartAll();wake(true);notifyFocusEnd();V.tab='focus';render()}
function logWork(min,ab,why){const f=K.focus;if(!f)return;const m=Math.round(min);if(m>=1||ab){K.sessions.push({id:uid(),taskId:f.taskId,start:f.start,end:Date.now(),min:Math.max(0,m),mode:f.mode,ab:!!ab,why:why||null});const t=T(f.taskId);if(t&&m>0)t.actual=(t.actual||0)+m}
 if(f.park&&f.park.length){f.park.forEach(p=>newTask({title:p,src:'park'}));toast(f.park.length+' parked thought'+(f.park.length>1?'s':'')+' moved to Inbox');f.park=[]}}
function phaseEnd(){const f=K.focus;if(!f)return;
 if(f.phase==='work'){logWork(f.dur);chime('end');vib([90,60,90]);
  if(f.tiny){K.focus=null;FDONE={taskId:f.taskId,tiny:true,min:f.dur};finishCommon();return}
  if(f.mode==='block'){K.focus=null;FDONE={taskId:f.taskId,min:f.dur};finishCommon();return}
  const long=f.mode==='pomo'&&f.cycle%4===0;const br=f.mode==='pomo'?(long?K.set.pomo[2]:K.set.pomo[1]):f.mode==='custom'?K.set.custom[1]:clamp(Math.round(f.dur/5),3,15);
  K.focus=Object.assign({},f,{phase:'break',dur:br,start:Date.now(),paused:0,pausedAt:null,brTip:Math.floor(Math.random()*BREAKS.length)});sndStopAll();notifyFocusEnd();
 }else{chime('break');vib([30,80,30]);FDONE={taskId:f.taskId,next:true,cycle:f.cycle+1,mode:f.mode};K.focus=null;finishCommon();return}
 save();render()}
function finishCommon(){sndStopAll();wake(false);cancelFocusNotif();save();render()}
function finishFocus(){const f=K.focus;if(!f)return;let m=0;if(f.phase==='work'){m=fElapsed()/60;logWork(m)}K.focus=null;FDONE={taskId:f.taskId,min:Math.round(m)};chime('end');finishCommon()}
function flowBreak(){const f=K.focus;const m=fElapsed()/60;logWork(m);const br=clamp(Math.round(m/5),3,15);K.focus=Object.assign({},f,{phase:'break',dur:br,start:Date.now(),paused:0,pausedAt:null,brTip:Math.floor(Math.random()*BREAKS.length)});chime('end');sndStopAll();notifyFocusEnd();save();render()}
let wl=null;async function wake(on){try{if(on&&K.set.keepAwake&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen')}else if(!on&&wl){await wl.release();wl=null}}catch(e){}}
function tick(){const f=K.focus;if(!f)return;if(!f.pausedAt&&f.dur&&fRemain()<=0){phaseEnd();return}
 if(K.set.comfort.adhd&&f.phase==='work'&&f.dur&&!f.warned&&fRemain()<=300&&f.dur>10){f.warned=true;toast('5 minutes left. Start wrapping up.');vib(20)}
 const d=$('#fdig');if(d)d.textContent=fClock();const r=$('#fprog');if(r&&f.dur){const c=+r.dataset.c;r.style.strokeDashoffset=c*(1-clamp(fElapsed()/(f.dur*60),0,1))}const mi=$('#minit');if(mi)mi.textContent=fClock()}

 if(f)return`<div class="fbg" style="--ph:${photo(focusPhoto(f))}"></div><div class="fdark">${h}${focusRunning(f)}</div>`;if(FDONE)return h+focusDone();return h+focusSetup()};

 try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
 try{await navigator.clipboard.writeText(json);toast('Export saved and copied to the clipboard')}catch(e){toast('Export started')}}
function importData(txt){let d;try{d=JSON.parse(txt)}catch(e){toast('That file isn’t a Kairo export.');return}if(!d||!Array.isArray(d.tasks)){toast('That file isn’t a Kairo export.');return}
 sheet('Import this backup?',`<p style="margin:0">It has ${d.tasks.length} tasks and ${(d.sessions||[]).length} focus sessions. It replaces what’s on this phone now.</p><div class="rowx"><button class="btn sp" id="imOk">Replace my data</button><button class="btn sec" data-close>Cancel</button></div>`,w=>{$('#imOk',w).onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}location.reload()}},{nofocus:true})}

/* ---------------- notifications (budgeted) ---------------- */
async function askNotif(){const LN=PL.LocalNotifications;if(!LN)return;try{const r=await LN.requestPermissions();K.set.notifOK=r.display==='granted';save();scheduleNotifs();toast(K.set.notifOK?'Reminders on. At most '+K.set.notif+' a day.':'Notifications are off. You can turn them on in Android settings.')}catch(e){}}
async function scheduleNotifs(){const LN=PL.LocalNotifications;if(!NATIVE||!LN)return;try{await LN.cancel({notifications:[1,2,3,4].map(id=>({id}))});if(!K.set.notifOK)return;
 const hm=t=>{const[h,m]=t.split(':').map(Number);return{hour:h,minute:m}};
 const slots=[{id:1,title:'Ready when you are',body:'Plan today in about 3 minutes.',schedule:{on:hm(K.set.morning),allowWhileIdle:true}},{id:3,title:'Time to close the day?',body:'A 2-minute shutdown helps you switch off.',schedule:{on:hm(K.set.shutdown),allowWhileIdle:true}},
  {id:2,title:'One small thing next?',body:'Your plan is here when you want it.',schedule:{on:{hour:13,minute:30},allowWhileIdle:true}},{id:4,title:'Weekly review',body:'15 minutes to close the week and set up the next.',schedule:{on:{weekday:1,hour:18,minute:0},allowWhileIdle:true}}];
 const list=slots.slice(0,K.set.notif);if(list.length)await LN.schedule({notifications:list})}catch(e){}}
async function notifyFocusEnd(){const LN=PL.LocalNotifications,f=K.focus;if(!NATIVE||!LN||!f||!f.dur||f.pausedAt)return;try{await LN.cancel({notifications:[{id:100}]});const t=T(f.taskId);
 await LN.schedule({notifications:[{id:100,title:f.phase==='break'?'Break’s over':'Focus session complete',body:f.phase==='break'?'Ready for the next round?':(t?t.title+' · time for a break':'Time for a break'),schedule:{at:new Date(Date.now()+fRemain()*1000),allowWhileIdle:true}}]})}catch(e){}}
async function cancelFocusNotif(){const LN=PL.LocalNotifications;if(!NATIVE||!LN)return;try{await LN.cancel({notifications:[{id:100}]})}catch(e){}}
async function cancelAllNotifs(){const LN=PL.LocalNotifications;if(!NATIVE||!LN)return;try{await LN.cancel({notifications:[1,2,3,4,100].map(id=>({id}))})}catch(e){}}

/* ---------------- overlays: onboarding, plan, shutdown, review, clarify, lessons ---------------- */
function renderOV(){const el=$('#ovl');if(!OV){el.innerHTML='';document.body.style.overflow='';renderMini();return}document.body.style.overflow='hidden';
 const r=OVR[OV.kind]();el.innerHTML=`<div class="ov ov-${OV.kind}" role="dialog" aria-modal="true"><div class="oin">${r}</div></div>`;const f=$('.ov [autofocus]');if(f)setTimeout(()=>f.focus(),50);OV.mount&&OV.mount();renderMini()}
function dots(n,i){return`<div class="dots" aria-label="Step ${i+1} of ${n}">${[...Array(n)].map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>`}
function ovTop(n,i,close=true){return`<div class="rowx">${i>0?`<button class="ib" data-a="ovBack" aria-label="Back">${IC.back}</button>`:'<span style="width:44px"></span>'}<span class="sp">${dots(n,i)}</span>${close?`<button class="ib" data-a="ovClose" aria-label="Close">${IC.x}</button>`:'<span style="width:44px"></span>'}</div>`}
function OVN(dir){const o=OV;if(!o)return;const h=OVH[o.kind];if(h&&h(dir)===false)return;o.step+=dir;if(o.step<0)o.step=0;renderOV();$('.ov')&&($('.ov').scrollTop=0)}
const OVR={},OVH={};
/* onboarding: brain dump -> pick 3 -> place -> start */
OVR.onb=()=>{const o=OV,s=o.step;
 if(s===0)return`<div class="sp"></div><div class="empty">${lot('done',{fb:'rocket',cls:'lot-lg'})}<h1>Let’s plan today in under a minute.</h1><p class="mut" style="margin:0;max-width:340px">Kairo turns a messy list into a realistic, kind day. No account needed. Your tasks stay on your phone unless you share them.</p></div><div class="sp"></div><button class="btn big wide" data-a="ovNext">Start</button><button class="btn ghost" id="obSkip">Skip, I’ll explore</button>`;
 if(s===1)return ovTop(4,0,false)+`<h1>What’s on your mind?</h1><p class="mut" style="margin:0">Type 3 to 10 things, one per line. Tasks, errands, worries: anything.</p><textarea class="f" id="obDump" rows="9" autofocus placeholder="Finish slides for Thursday\nCall the bank\nGym\nReply to Sara\nBuy groceries">${H((o.lines||[]).join('\n'))}</textarea><button class="btn big wide" data-a="ovNext">Next</button><button class="btn ghost" id="obEx">Use an example list</button>`;
 if(s===2)return ovTop(4,1,false)+`<h1>Pick up to 3 that matter today</h1><p class="mut" style="margin:0">The rest waits safely in your Inbox.</p><div class="stack" style="gap:8px">${o.lines.map((l,i)=>`<button class="opt ${o.pick.includes(i)?'on':''}" data-pk="${i}"><span class="oi">${o.pick.includes(i)?'★':'☆'}</span><span class="sp"><b>${H(l)}</b></span></button>`).join('')}</div><button class="btn big wide" data-a="ovNext" ${o.pick.length?'':'disabled style="opacity:.5"'}>Place them on my day</button>`;
 if(s===3){return ovTop(4,2,false)+`<h1>How long for each?</h1><p class="mut" style="margin:0">Rough guesses are fine. Kairo learns how long things really take you.</p>${o.pick.map(i=>`<div class="card flat stack" style="gap:8px"><b>${H(o.lines[i])}</b><div class="chips">${[15,30,45,60,90].map(m=>`<button class="chip ${o.est[i]===m?'on':''}" data-oe="${i}" data-m="${m}">${fmtDur(m)}</button>`).join('')}</div></div>`).join('')}<div class="card flat stack"><span class="lbl">Your day ends around</span><div class="chips">${['16:00','17:00','18:00','19:00','20:00','22:00'].map(t=>`<button class="chip ${K.set.dayEnd===t?'on':''}" data-de="${t}">${fmtT(t)}</button>`).join('')}</div></div><button class="btn big wide" data-a="ovNext">See my day</button>`}
 if(s===4)return ovTop(4,3,false)+`<h1>Your day is set</h1>${realityBar(today())}${timeline(today())}<button class="btn big wide" data-a="ovNext">${IC.play} 10 minutes on the first?</button><button class="btn ghost" id="obLater">Maybe later</button>`;
 return''};
OVH.onb=dir=>{const o=OV;if(dir<0)return;if(o.step===1){const v=$('#obDump').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,15);if(!v.length){toast('Add at least one thing.');return false}o.lines=v;o.pick=o.pick&&o.pick.every(i=>i<v.length)?o.pick:[];o.est=o.est||{}}
 if(o.step===2&&!o.pick.length)return false;
 if(o.step===3){// create tasks
  if(!o.made){o.made=[];o.lines.forEach((l,i)=>{const chosen=o.pick.includes(i);const t=taskFromNL(l,chosen?{status:'open',doDate:today(),est:o.est[i]||30,mit:true,src:'onb'}:{src:'onb'});if(t&&chosen)o.made.push(t.id)})}
  const r=arrange(today(),o.made);r.plan.forEach(p=>{T(p.id).start=p.start});dayW(today()).planned=true;save();V.lockAnim=true}
 if(o.step===4){K.onboarded=true;save();OV=null;renderOV();V.lockAnim=false;startFocus({taskId:o.made[0],mode:'custom',dur:10,tiny:true});setTimeout(personalise,400);return false}};
function mountOnb(){const o=OV;$$('[data-pk]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pk;if(o.pick.includes(i))o.pick=o.pick.filter(x=>x!==i);else if(o.pick.length<3)o.pick.push(i);else toast('Three is plenty for a first day.');renderOV()});
 $$('[data-oe]').forEach(b=>b.onclick=()=>{o.est[+b.dataset.oe]=+b.dataset.m;renderOV()});$$('[data-de]').forEach(b=>b.onclick=()=>{K.set.dayEnd=b.dataset.de;save();renderOV()});
 const sk=$('#obSkip');if(sk)sk.onclick=()=>{K.onboarded=true;save();OV=null;renderOV();render()};const ex=$('#obEx');if(ex)ex.onclick=()=>{$('#obDump').value='Finish slides for Thursday 45m\nCall the bank 15m\nGym 1h\nReply to Sara 10m\nBuy groceries\nPlan weekend trip';};
 const la=$('#obLater');if(la)la.onclick=()=>{K.onboarded=true;save();OV=null;V.lockAnim=false;renderOV();render();setTimeout(personalise,300)};
 if(o.step===3)o.pick.forEach(i=>{if(!o.est[i])o.est[i]=30})}
function personalise(){sheet('Make Kairo yours',`<p class="mut" style="margin:0">All optional. You can change these any time in You → Settings.</p>
 <label class="stack" style="gap:6px"><span class="lbl">Best focus time</span><select class="f" id="pPeak"><option value="morning">Morning</option><option value="afternoon">Afternoon</option><option value="evening">Evening</option></select></label>
 <button class="opt" id="pAdhd"><span class="sp"><b>Focus-friendly (ADHD) mode</b><span class="xs mut">Timeline first, countdowns, 5-minute warnings</span></span><span class="pill" id="pAdhdV">Off</span></button>
 ${NATIVE?`<button class="opt" id="pNot"><span class="sp"><b>Gentle reminders</b><span class="xs mut">Morning plan + shutdown + one nudge. Max 3 a day.</span></span><span class="pill">Turn on</span></button>`:''}
 <button class="btn" data-close>Done</button>`,w=>{$('#pPeak',w).value=K.set.peak;$('#pPeak',w).onchange=e=>{K.set.peak=e.target.value;save()};
  $('#pAdhd',w).onclick=()=>{K.set.comfort.adhd=!K.set.comfort.adhd;$('#pAdhdV',w).textContent=K.set.comfort.adhd?'On':'Off';$('#pAdhd',w).classList.toggle('on',K.set.comfort.adhd);save();render()};
  const pn=$('#pNot',w);if(pn)pn.onclick=async()=>{await askNotif();pn.querySelector('.pill').textContent=K.set.notifOK?'On':'Off'}},{nofocus:true})}

/* morning plan ritual */
function startPlan(){const tk=today();OV={kind:'plan',step:0,d:{energy:dayR(tk).energy||null,mood:dayR(tk).mood||'',win:dayR(tk).win||'',sel:null}};renderOV()}
OVR.plan=()=>{const o=OV,d=o.d,s=o.step,tk=today();
 if(s===0)return ovTop(4,0)+`<h1>Check in</h1><p class="mut" style="margin:0">How’s your energy right now?</p><div class="chips" style="justify-content:space-between">${[1,2,3,4,5].map(n=>`<button class="chip ${d.energy===n?'on':''}" data-en="${n}" style="font-size:26px;min-height:60px;min-width:56px;justify-content:center" aria-label="Energy ${n} of 5">${['😴','🥱','🙂','😊','⚡'][n-1]}</button>`).join('')}</div>
 ${d.energy&&d.energy<=2?`<div class="card flat" style="background:var(--wnbg)">Low energy is information, not failure. Kairo will suggest a lighter plan: three essentials.</div>`:''}
 <label class="stack" style="gap:6px"><span class="lbl">One word for your mood (optional)</span><input class="f" id="plMood" value="${H(d.mood)}" placeholder="calm, busy, anxious…"></label>
 <label class="stack" style="gap:6px"><span class="lbl">What would make today a win, even if nothing else got done?</span><input class="f" id="plWin" value="${H(d.win)}" placeholder="Send the proposal"></label><div class="sp"></div><button class="btn big wide" data-a="ovNext">Next</button>`;
 if(s===1){if(!d.sel){d.sel=new Set();todayList(tk).filter(t=>t.status==='open').forEach(t=>d.sel.add(t.id));rescueList().forEach(t=>d.sel.add(t.id));K.tasks.filter(t=>t.status==='open'&&t.dueDate&&dayDiff(tk,t.dueDate)<=2).forEach(t=>d.sel.add(t.id))}
  const grp=[['Planned for today',todayList(tk).filter(t=>t.status==='open')],['Didn’t fit before',rescueList()],['Due soon',K.tasks.filter(t=>t.status==='open'&&t.dueDate&&dayDiff(tk,t.dueDate)<=3&&t.doDate!==tk&&!(t.doDate&&t.doDate<tk))],['Anytime',anytime().filter(t=>!(t.dueDate&&dayDiff(tk,t.dueDate)<=3))],['Inbox',inboxList()]];
  return ovTop(4,1)+`<h1>Pull in</h1><p class="mut" style="margin:0">Tick what could happen today. You’ll trim next.</p>${grp.filter(g=>g[1].length).map(([n,ts])=>`<div class="stack" style="gap:6px"><span class="lbl">${n} · ${ts.length}</span>${ts.slice(0,25).map(t=>`<button class="opt ${d.sel.has(t.id)?'on':''}" data-ps="${t.id}"><span class="oi">${d.sel.has(t.id)?'☑':'☐'}</span><span class="sp"><b>${H(t.title)}</b><span class="xs mut">${t.est?fmtDur(t.est):'no estimate'}${t.dueDate?' · due '+fmtDate(t.dueDate):''}</span></span></button>`).join('')}</div>`).join('')||'<p class="mut">Nothing waiting. Add something below.</p>'}
  <div class="rowx"><input class="f sp" id="plAdd" placeholder="Add a task for today…" enterkeyhint="done"><button class="btn sec" id="plAddB" aria-label="Add">${IC.plus}</button></div><div class="sp"></div><button class="btn big wide" data-a="ovNext">Next · ${d.sel.size} picked</button>`}
 if(s===2){const ts=[...d.sel].map(T).filter(Boolean);const light=d.energy&&d.energy<=2;const planned=ts.reduce((a,t)=>a+(t.est||0),0);const avail=dayLeft();const over=planned>avail;const g={big:0,med:0,small:0};ts.forEach(t=>{const z=sizeOf(t);if(z)g[z]++});
  const cap=light?3:9;
  return ovTop(4,2)+`<h1>Pick & cap</h1><p class="mut" style="margin:0">${light?'Lighter day: aim for three essentials.':'The 1-3-5 guide: one big, three medium, five small.'} Star up to 3 most important. Mark the dreaded one as 🐸.</p>
  <div class="card flat rbar"><div class="rowx"><b class="tab">${fmtDur(planned)} planned</b><span class="mut tab">· ${fmtDur(avail)} free</span><span class="sp"></span>${over?`<span class="pill amb">Over by ${fmtDur(planned-avail)}</span>`:''}</div><div class="rtrack"><div class="rfill ${over?'over':''}" style="width:${Math.min(100,avail?planned/avail*100:100)}%"></div></div><div class="xs mut">Big ${g.big}/1 · Medium ${g.med}/3 · Small ${g.small}/5${ts.length>cap?` · <span class="amb">${ts.length} tasks, maybe trim?</span>`:''}</div></div>
  ${ts.map(t=>{const se=smartEst(t);return`<div class="card flat stack" style="gap:8px"><div class="rowx"><b class="sp" style="overflow-wrap:anywhere">${H(t.title)}</b><button class="ib" data-pm="${t.id}" aria-label="Most important" style="color:var(--wn)">${t.mit?IC.starf:IC.star}</button><button class="ib" data-pf="${t.id}" aria-label="Frog" style="opacity:${t.frog?1:.35};font-size:20px">🐸</button><button class="ib" data-pr="${t.id}" aria-label="Not today">${IC.x}</button></div>
   <div class="chips">${[15,30,45,60,90].map(m=>`<button class="chip ${t.est===m?'on':''}" data-pe="${t.id}" data-m="${m}">${fmtDur(m)}</button>`).join('')}</div>${se?`<div class="xs"><button class="chip" data-pe="${t.id}" data-m="${se.min}">✨ You usually take ${se.r}×: plan ${fmtDur(se.min)}?</button></div>`:''}</div>`}).join('')}
  <div class="sp"></div><button class="btn big wide" data-a="ovNext">Place on my day</button>`}
 if(s===3)return ovTop(4,3)+`<h1>Place</h1><p class="mut" style="margin:0">Here’s a proposed timeline. Accept it, or edit times later by tapping a block.</p>${timeline(tk,1)}<div class="sp"></div><button class="btn big wide" data-a="ovNext">${IC.lock} Lock in my day</button>`;
 if(s===4)return`<div class="sp"></div><div class="empty">${lot('calendar',{fb:'calender',cls:'lot-sm'})}<h1>Your day is set</h1><p class="mut" style="margin:0">${openOn().length} tasks · ${fmtDur(reality().planned)} planned. Be kind to yourself if it shifts.</p></div><div class="lockin">${timeline(tk,0)}</div><button class="btn big wide" data-a="ovClose">Let’s go</button>`;return''};
OVH.plan=dir=>{const o=OV,d=o.d,tk=today();if(dir<0)return;
 if(o.step===0){if(!d.energy){toast('Pick an energy level first.');return false}d.mood=$('#plMood').value.trim();d.win=$('#plWin').value.trim();const w=dayW(tk);w.energy=d.energy;w.mood=d.mood;w.win=d.win;w.light=d.energy<=2;save()}
 if(o.step===1){if(!d.sel.size){toast('Pick at least one task, or add one.');return false}}
 if(o.step===2){const sel=[...d.sel];sel.filter(T).forEach(id=>{const t=T(id);if(t.doDate&&t.doDate<tk){t.rescues++;dayW(tk).rescued=1}t.doDate=tk;t.status='open'});
  const unplaced=sel.filter(id=>!T(id).start);const r=arrange(tk,unplaced);r.plan.forEach(p=>{const t=T(p.id);t.start=p.start;if(!t.est)t.est=p.dur});d.over=r.over.map(t=>t.id);save()}
 if(o.step===3){dayW(tk).planned=true;save();vib([8,40,8,40,8]);chime('tick');setTimeout(confetti,250);if(d.over&&d.over.length)toast(d.over.length+' task'+(d.over.length>1?'s don’t':' doesn’t')+' fit before '+fmtT(K.set.dayEnd)+'. They’re listed under the timeline.')}};
function mountPlan(){const o=OV,d=o.d;$$('[data-en]').forEach(b=>b.onclick=()=>{d.mood=($('#plMood')||{}).value||d.mood;d.win=($('#plWin')||{}).value||d.win;d.energy=+b.dataset.en;renderOV()});
 $$('[data-ps]').forEach(b=>b.onclick=()=>{const id=b.dataset.ps;d.sel.has(id)?d.sel.delete(id):d.sel.add(id);renderOV()});
 const add=()=>{const i=$('#plAdd');const v=i.value.trim();if(!v)return;const t=taskFromNL(v,{status:'open',doDate:today()});if(t)d.sel.add(t.id);renderOV();setTimeout(()=>{const n=$('#plAdd');n&&n.focus()},30)};const ab=$('#plAddB');if(ab){ab.onclick=add;$('#plAdd').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}}}
 $$('[data-pe]').forEach(b=>b.onclick=()=>{T(b.dataset.pe).est=+b.dataset.m;save();renderOV()});
 $$('[data-pm]').forEach(b=>b.onclick=()=>{const t=T(b.dataset.pm);if(!t.mit&&[...d.sel].filter(id=>T(id).mit).length>=3){toast('Three most-important is the limit.');return}t.mit=!t.mit;save();renderOV()});
 $$('[data-pf]').forEach(b=>b.onclick=()=>{const t=T(b.dataset.pf);t.frog=!t.frog;save();renderOV()});
 $$('[data-pr]').forEach(b=>b.onclick=()=>{d.sel.delete(b.dataset.pr);renderOV()})}

/* shutdown ritual */
function startShutdown(){OV={kind:'shutdown',step:0,d:{}};renderOV()}
OVR.shutdown=()=>{const o=OV,s=o.step,tk=today(),tm=addDays(tk,1);const dn=doneOn(tk),fm=focusMin(tk);
 if(s===0)return ovTop(4,0)+`<h1>Look what you did</h1><div class="card flat" style="text-align:center"><div class="dl">${dn.length}</div><div class="mut">thing${dn.length===1?'':'s'} done · ${fmtDur(fm)} focus</div></div>${list(dn,{noplay:1})}${!dn.length?'<p class="mut">Some days are about showing up. That counts too.</p>':''}
 <label class="stack" style="gap:6px"><span class="lbl">Any win that wasn’t a task?</span><input class="f" id="sdWin" placeholder="Handled a tough call"></label>${dayR(tk).win?`<div class="card flat sm">This morning’s win: <b>${H(dayR(tk).win)}</b></div>`:''}<div class="sp"></div><button class="btn big wide" data-a="ovNext">Next</button>`;
 if(s===1){const un=openOn(tk).concat(rescueList());return ovTop(4,1)+`<h1>Rescue the rest</h1><p class="mut" style="margin:0">${un.length?un.length+' didn’t get done. That’s normal. Where should each go?':'Nothing left over. Lovely.'}</p>
  ${un.map(t=>`<div class="card flat stack" style="gap:8px"><b style="overflow-wrap:anywhere">${H(t.title)}</b><div class="chips">${[['tom','Tomorrow'],['pick','Pick a day'],['someday','Someday'],['letgo','Let go']].map(([v,l])=>`<button class="chip ${o.d['r'+t.id]===v?'on':''}" data-sr="${t.id}" data-v="${v}">${l}</button>`).join('')}</div></div>`).join('')}
  ${un.length>1?`<button class="btn sec" id="sdAllTom">All to tomorrow</button>`:''}<div class="sp"></div><button class="btn big wide" data-a="ovNext">Next</button>`}
 if(s===2)return ovTop(4,2)+`<h1>Anything still on your mind?</h1><p class="mut" style="margin:0">Write down open loops, one per line. Each one goes to your Inbox so your head can let go.</p><textarea class="f" id="sdLoops" rows="6" placeholder="Ask Omar about the invoice\nBuy printer ink"></textarea><div class="sp"></div><button class="btn big wide" data-a="ovNext">Next</button>`;

async function ensureToken(){const a=K.auth;if(!a||Date.now()<a.exp-60000)return;const j=await sbReq('/auth/v1/token?grant_type=refresh_token',{refresh_token:a.refresh},false);setSession(j)}

  Object.assign(H1,pushed);Object.assign(H2,lp);K.deadLists=[];K.tasks.forEach(t=>(t.comments||[]).forEach(c=>{if(c.pending&&isShared(t))c.pending=false}));

function mergeRemote(res){const me=myEmail();let fresh=[];
 (res.lists||[]).forEach(l=>{let loc=P(l.id);if(l.deleted){if(loc){K.tasks.forEach(t=>{if(t.project===l.id)t.project=null});K.projects=K.projects.filter(x=>x.id!==l.id)}return}
  const d=Object.assign({},l.data,{id:l.id,remote:true,owner:l.owner_email,members:(l.members||[]).filter(m=>m.email!==me).concat(l.owner_email&&l.owner_email!==me?[]:[])});
  if(l.owner_email!==me&&!(l.members||[]).some(m=>m.email===me))return;

 (res.tasks||[]).forEach(r=>{const loc=T(r.id);const up=Date.parse(r.updated_at);if(loc&&(loc.updated||0)>up&&K.syncHash[r.id]!==JSON.stringify(taskPayload(loc)))return;
  const base={title:'',notes:'',project:null,tags:[],prio:4,est:null,actual:0,doDate:null,dueDate:null,start:null,status:'open',stage:'todo',hurdle:'',next:'',assignee:null,by:null,log:[],remind:null,subtasks:[],recur:null,created:up};
  const d=Object.assign(base,r.data||{},{id:r.id,remote:true,updated:up,project:r.list_id||(r.data&&r.data.project)||null});if(r.deleted)d.status='deleted';
  if(d.project&&!P(d.project))d.project=null;
  if(d.assignee&&d.assignee.email===me&&(!loc||!loc.assignee||loc.assignee.email!==me)&&!(d.by&&d.by.email===me)){fresh.push(d);d.seen=false;note(`${pname(d.by)||'Someone'} assigned you “${d.title}”`,d.id,'assign')}

  if(loc){const cs=loc.comments,sn=loc.seen;Object.assign(loc,d);loc.comments=cs||[];if(sn&&!fresh.includes(d))loc.seen=sn}else{d.comments=[];K.tasks.push(d)}
  K.syncHash[r.id]=JSON.stringify(taskPayload(T(r.id)));if(d.by)addPerson(d.by);if(d.assignee)addPerson(d.assignee)});
 (res.comments||[]).forEach(c=>{const t=T(c.task_id);if(!t)return;t.comments=t.comments||[];if(t.comments.some(x=>x.id===c.id))return;t.comments.push({id:c.id,by:{email:c.author_email,name:c.author_name},t:c.body,at:Date.parse(c.created_at)});

 if(fresh.length)localAlert(fresh.length===1?`${pname(fresh[0].by)} assigned you a task`:`${fresh.length} new tasks assigned to you`,fresh.map(t=>t.title).join(', '));
 scheduleReminders()}

async function scheduleExtraAlerts(){const tk=today(),now=Date.now();const items=[];K.tasks.forEach(t=>{if(t.status!=='open')return;
  if(t.start&&t.doDate&&t.remind==null&&K.set.autoRemind!==false){const d=parseD(t.doDate);const[h,m]=t.start.split(':').map(Number);d.setHours(h,m,0,0);items.push({at:d.getTime(),title:t.title,body:'Now · '+fmtT(t.start)})}
  if(t.dueDate&&K.set.dueAlerts!==false){const d=parseD(t.dueDate);d.setHours(9,0,0,0);items.push({at:d.getTime(),title:'Due today: '+t.title,body:'Deadline is today.'});const b=new Date(d.getTime()-864e5);items.push({at:b.getTime(),title:'Due tomorrow: '+t.title,body:'One day to go.'})}});
 const up=items.filter(x=>x.at>now&&x.at<now+31*864e5).sort((a,b)=>a.at-b.at).slice(0,60);
 const LN=PL.LocalNotifications;if(NATIVE&&LN){try{if(K.xIds&&K.xIds.length)await LN.cancel({notifications:K.xIds.map(id=>({id}))});K.xIds=[];if(!K.set.notifOK){save();return}
   const ns=up.map((x,i)=>({id:4000+i,title:x.title,body:x.body,schedule:{at:new Date(x.at),allowWhileIdle:true}}));if(ns.length)await LN.schedule({notifications:ns});K.xIds=ns.map(n=>n.id);save()}catch(e){}return}
 /* laptop / browser: Chrome notifications while Kairo is open */
 (window.__kxT||[]).forEach(clearTimeout);window.__kxT=[];if(!('Notification' in window)||Notification.permission!=='granted')return;
